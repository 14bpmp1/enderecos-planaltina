function render(){renderAreas();const q=norm($('search').value.trim());const found=data.filter(x=>(!selected||x.area===selected)&&norm(x.area+' '+x.region+' '+x.title).includes(q));$('count').textContent=found.length.toLocaleString('pt-BR')+' endereço(s) encontrado(s)';const root=$('cards');root.replaceChildren();if(!found.length){const el=document.createElement('div');el.className='empty';el.textContent='Nenhum endereço encontrado. Tente outra pesquisa.';root.append(el)}for(const x of found.slice(0,limit)){const c=document.createElement('article');c.className='card';const tag=document.createElement('div');tag.className='tag';tag.textContent=x.area;const name=document.createElement('div');name.className='name';name.textContent=x.title;const sub=document.createElement('div');sub.className='sub';sub.textContent=x.region;c.append(tag,name,sub);if(x.coords||x.url){const a=document.createElement('a');a.className='action';a.href=x.coords?'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(x.coords):x.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='↗ Traçar rota no Google Maps';c.append(a)}else{const m=document.createElement('div');m.className='missing';m.textContent='Localização exata ainda não cadastrada';c.append(m)}root.append(c)}$('more').hidden=found.length<=limit}
$('search').addEventListener('input',()=>{limit=40;render()});$('region').addEventListener('change',e=>{selected=e.target.value;limit=40;render()});$('more').onclick=()=>{limit+=40;render()};render();
// Integração com o Apps Script via JSONP, com a base original como contingência.
function normalizeRow(row){
  const entries=Object.entries(row).filter(([k])=>k!=='__aba');
  const get=(pattern)=>{const entry=entries.find(([k])=>pattern.test(norm(k)));return entry?String(entry[1]||'').trim():''};
  const area=String(row.__aba||get(/^regiao/)).trim();
  const region=get(/^regiao/)||area;
  const pieces=entries.filter(([k,v])=>v&& !/^(regiao|coordenadas|link|tracar rota)/.test(norm(k)))
    .map(([,v])=>String(v).trim()).filter(Boolean);
  let coords=get(/^coordenadas/);
  const match=coords.match(/(-?\d{1,2}[.,]\d+)\s*[,; ]+\s*(-?\d{1,3}[.,]\d+)/);
  coords=match?match[1].replace(',','.')+','+match[2].replace(',','.') : '';
  const direct=get(/^(link rota direta|tracar rota|link para busca)/);
  const url=/^https?:\/\//i.test(direct)?direct:'';
  return {area,region,title:pieces.join(' · ')||region,coords:coords||null,url};
}
// Apenas callbacks fixos e resultados textuais: nunca executar conteúdo de células como HTML.
function loadSheets(){
  const callback='enderecosPlanaltinaCallback';
  let finished=false;
  const script=document.createElement('script');
  const timer=setTimeout(()=>done(false),16000);
  function done(success){if(finished)return;finished=true;clearTimeout(timer);script.remove();delete window[callback];if(!success)$('source').textContent='Base local (Google Sheets indisponível)'}
  window[callback]=function(payload){
    if(!payload||payload.ok!==true||!Array.isArray(payload.registros)){done(false);return}
    const rows=payload.registros.map(normalizeRow).filter(x=>x.area&&x.title);
    if(!rows.length){done(false);return}
    data=rows;refreshAreas();limit=40;render();$('source').textContent='Atualizado pelo Google Sheets';done(true);
  };
  script.onerror=()=>done(false);
  script.src=API_URL+'?callback='+callback+'&t='+Date.now();
  document.head.appendChild(script);
}
loadSheets();
