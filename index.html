
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8fafc">
<title>Rotas & Endereços - Planaltina DF</title>

<style>
:root {
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#172338;
  --muted:#64748b;
  --border:#e2e8f0;
  --blue:#2563eb;
  --soft:#eff6ff;
}

html.dark {
  --bg:#0b1220;
  --card:#172235;
  --text:#f1f5f9;
  --muted:#a4b2c6;
  --border:#334155;
  --blue:#93b4ff;
  --soft:#233b60;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select { font:inherit; }
button { cursor:pointer; }

header {
  position:sticky;
  top:0;
  z-index:10;
  background:var(--card);
  border-bottom:1px solid var(--border);
}

.header-inner {
  max-width:1150px;
  margin:auto;
  padding:12px 15px;
  display:flex;
  align-items:center;
  gap:10px;
}

.logo {
  width:38px;
  height:38px;
  border-radius:11px;
  background:linear-gradient(135deg,#1d4ed8,#6366f1);
  display:grid;
  place-items:center;
  color:white;
  font-size:23px;
}

.brand { flex:1; min-width:0; }

.brand h1 {
  font-size:17px;
  margin:0;
  line-height:1.3;
}

.brand strong { color:var(--blue); }

.brand p {
  font-size:11px;
  color:var(--muted);
  margin:3px 0 0;
}

.theme-button {
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
  font-size:19px;
}

main {
  max-width:1150px;
  margin:auto;
  padding:14px 12px 40px;
}

.search-panel {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:12px;
}

.filters {
  display:grid;
  grid-template-columns:1fr 220px;
  gap:9px;
}

input,select {
  width:100%;
  height:43px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  padding:0 12px;
  font-size:14px;
}

input:focus,select:focus {
  outline:2px solid #60a5fa;
  outline-offset:1px;
}

.regions {
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:12px 0 3px;
  scrollbar-width:thin;
}

.region-button {
  white-space:nowrap;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  border-radius:999px;
  padding:8px 12px;
  font-size:12px;
  font-weight:650;
}

.region-button.active {
  background:#2563eb;
  color:white;
  border-color:#2563eb;
}

.summary {
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  margin:14px 2px 11px;
}

.count {
  font-size:13px;
  font-weight:750;
}

.source {
  margin-top:4px;
  font-size:11px;
  color:var(--muted);
}

.tools {
  display:flex;
  align-items:center;
  gap:8px;
}

.tool-button {
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:9px;
  padding:8px 10px;
  font-size:12px;
}

.reset-button {
  border:0;
  background:transparent;
  color:var(--blue);
  font-size:12px;
  font-weight:650;
}

.results {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}

.card {
  min-width:0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.card-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
}

.region-label {
  font-size:10px;
  font-weight:750;
  color:var(--blue);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.gps-label {
  font-size:10px;
  color:var(--muted);
  white-space:nowrap;
}

.card h2 {
  font-size:14px;
  line-height:1.35;
  margin:0;
  overflow-wrap:anywhere;
}

.card-description {
  color:var(--muted);
  font-size:12px;
  line-height:1.35;
  overflow-wrap:anywhere;
}

.actions {
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:auto;
  padding-top:5px;
}

.action-link {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  min-height:35px;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--soft);
  color:var(--blue);
  text-decoration:none;
  font-size:12px;
  font-weight:700;
}

.action-link.waze {
  background:var(--card);
  color:var(--text);
}

.copy-button {
  margin-left:auto;
  width:35px;
  height:35px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
}

.results.list {
  grid-template-columns:1fr;
}

.results.list .card {
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  column-gap:12px;
}

.results.list .card-top,
.results.list .card h2,
.results.list .card-description {
  grid-column:1;
}

.results.list .actions {
  grid-column:2;
  grid-row:1/4;
  align-self:center;
  padding:0;
}

.more {
  display:block;
  margin:18px auto;
  padding:11px 20px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-weight:700;
}

.more[hidden] { display:none; }

.empty {
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  grid-column:1/-1;
}

footer {
  text-align:center;
  padding:10px 15px 30px;
  font-size:11px;
  color:var(--muted);
}

.toast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#1e293b;
  color:white;
  padding:11px 16px;
  border-radius:10px;
  font-size:12px;
  z-index:20;
}

.toast[hidden] { display:none; }

@media(max-width:850px) {
  .results {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

/* Otimização principal para celulares */
@media(max-width:600px) {
  .header-inner { padding:10px 12px; }
  .brand h1 { font-size:15px; }
  .brand p { display:none; }

  main { padding:10px 10px 35px; }

  .search-panel { padding:9px; }

  .filters { grid-template-columns:1fr; }

  .regions {
    margin-right:-9px;
    padding-right:9px;
  }

  .results {
    grid-template-columns:1fr;
    gap:7px;
  }

  .card {
    padding:10px 11px;
    gap:5px;
    border-radius:11px;
  }

  .card h2 { font-size:14px; }

  .card-description { font-size:11px; }

  .actions { padding-top:4px; }

  .action-link {
    min-height:34px;
    padding:7px 10px;
    font-size:11px;
  }

  .copy-button {
    width:34px;
    height:34px;
  }

  .results.list .action-text {
    display:none;
  }

  .results.list .action-link {
    padding:7px;
  }

  .tools { gap:4px; }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">⌖</div>

    <div class="brand">
      <h1>Rotas & Endereços <strong>Planaltina DF</strong></h1>
      <p>Pesquisa de setores, quadras e conjuntos</p>
    </div>

    <button id="themeButton" class="theme-button"
            aria-label="Alternar tema">☾</button>
  </div>
</header>

<main>

  <section class="search-panel">
    <div class="filters">
      <input id="searchInput"
             type="search"
             placeholder="Buscar quadra, conjunto, rua ou região..."
             aria-label="Pesquisar endereços">

      <select id="quadraSelect" aria-label="Selecionar quadra">
        <option value="">Todas as quadras</option>
      </select>
    </div>

    <nav id="regionButtons" class="regions"
         aria-label="Selecionar região"></nav>
  </section>

  <section class="summary">
    <div>
      <div id="resultCount" class="count">Carregando...</div>
      <div id="sourceStatus" class="source">
        Consultando Google Sheets...
      </div>
    </div>

    <div class="tools">
      <button id="resetButton" class="reset-button">
        Limpar
      </button>

      <button id="viewButton" class="tool-button">
        ☷ Lista
      </button>
    </div>
  </section>

  <div id="results" class="results"></div>

  <button id="moreButton" class="more" hidden>
    Mostrar mais endereços
  </button>

</main>

<footer>
  Rotas por GPS disponíveis somente para coordenadas cadastradas.
  Confirme o destino antes de iniciar a navegação.
</footer>

<div id="toast" class="toast" hidden role="status"></div>

<script>

/* ==========================================
   CONFIGURAÇÃO DO GOOGLE SHEETS
========================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbw2kGBssCuloibNszSTPPEujJjjhuzR7mGrRi7_HMGYqd8BdQ4BVPjqfirLTIuQskN3/exec";

/* ==========================================
   ESTADO DA APLICAÇÃO
========================================== */

let enderecos = [];
let regiaoAtual = "";
let quadraAtual = "";
let pesquisaAtual = "";
let limite = 40;
let modoLista = false;

const el = id => document.getElementById(id);

function normalizar(valor) {
  return String(valor ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

/* ==========================================
   LEITURA DAS COLUNAS DA PLANILHA
========================================== */

function obterCampo(linha, expressao) {
  const chave = Object.keys(linha).find(
    nome => expressao.test(normalizar(nome))
  );

  return chave ? String(linha[chave] ?? "").trim() : "";
}

function interpretarCoordenadas(valor) {
  const texto = String(valor ?? "").trim();

  const numeros = texto.match(
    /-?\d{1,3}(?:[.,]\d+)?/g
  );

  if (!numeros || numeros.length !== 2) return null;

  const lat = Number(numeros[0].replace(",", "."));
  const lng = Number(numeros[1].replace(",", "."));

  if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lng) ||
    Math.abs(lat) > 90 ||
    Math.abs(lng) > 180 ||
    (lat === 0 && lng === 0)
  ) {
    return null;
  }

  return `${lat},${lng}`;
}

function converterLinha(linha) {
  const regiao = String(
    linha.__aba || obterCampo(linha, /^regiao/)
  ).trim();

  const bairro = obterCampo(linha, /^regiao/) || regiao;

  const coordenadas = interpretarCoordenadas(
    obterCampo(linha, /^coordenadas/) ||
    obterCampo(linha, /^latitude.*longitude/)
  );

  const partes = Object.entries(linha)
    .filter(([chave, valor]) => {
      const nome = normalizar(chave);

      return (
        chave !== "__aba" &&
        String(valor ?? "").trim() !== "" &&
        !/^(regiao|coordenadas|link|tracar rota)/.test(nome)
      );
    })
    .map(([, valor]) => String(valor).trim());

  return {
    regiao,
    bairro,
    titulo: partes.join(" · ") || bairro,
    coordenadas
  };
}

/* ==========================================
   IDENTIFICAÇÃO DE QUADRAS
========================================== */

function identificarQuadra(item) {
  const texto = item.titulo;

  const resultado = texto.match(
    /(?:^|[^\p{L}])(?:quadra|qd?\.?|q)\s*(\d+[a-z]?)/iu
  );

  if (resultado) {
    return "Quadra " + resultado[1].toUpperCase();
  }

  return "";
}

/* ==========================================
   FILTROS DINÂMICOS
========================================== */

function atualizarFiltros() {
  const regioes = [...new Set(
    enderecos.map(item => item.regiao).filter(Boolean)
  )].sort((a, b) =>
    a.localeCompare(b, "pt-BR", {numeric:true})
  );

  const container = el("regionButtons");
  container.replaceChildren();

  if (regiaoAtual && !regioes.includes(regiaoAtual)) {
    regiaoAtual = "";
  }

  ["Todas", ...regioes].forEach(nome => {
    const botao = document.createElement("button");

    const selecionado =
      nome === "Todas"
        ? !regiaoAtual
        : regiaoAtual === nome;

    botao.className =
      "region-button" + (selecionado ? " active" : "");

    botao.textContent = nome;
    botao.type = "button";
    botao.setAttribute("aria-pressed", selecionado);

    botao.onclick = () => {
      regiaoAtual = nome === "Todas" ? "" : nome;
      quadraAtual = "";
      limite = 40;
      atualizarFiltros();
      mostrarResultados();
    };

    container.appendChild(botao);
  });

  const quadras = [...new Set(
    enderecos
      .filter(item =>
        !regiaoAtual || item.regiao === regiaoAtual
      )
      .map(identificarQuadra)
      .filter(Boolean)
  )].sort((a, b) =>
    a.localeCompare(b, "pt-BR", {numeric:true})
  );

  const select = el("quadraSelect");
  select.replaceChildren(
    new Option("Todas as quadras", "")
  );

  quadras.forEach(quadra => {
    select.appendChild(new Option(quadra, quadra));
  });

  if (!quadras.includes(quadraAtual)) {
    quadraAtual = "";
  }

  select.value = quadraAtual;
}

/* ==========================================
   PESQUISA
========================================== */

function obterResultados() {
  const palavras = normalizar(pesquisaAtual)
    .split(/\s+/)
    .filter(Boolean);

  return enderecos.filter(item => {
    if (
      regiaoAtual &&
      item.regiao !== regiaoAtual
    ) return false;

    if (
      quadraAtual &&
      identificarQuadra(item) !== quadraAtual
    ) return false;

    const texto = normalizar([
      item.regiao,
      item.bairro,
      item.titulo
    ].join(" "));

    return palavras.every(palavra =>
      texto.includes(palavra)
    );
  });
}

/* ==========================================
   CRIAÇÃO DOS CARDS
========================================== */

function criarCard(item) {
  const card = document.createElement("article");
  card.className = "card";

  const topo = document.createElement("div");
  topo.className = "card-top";

  const regiao = document.createElement("span");
  regiao.className = "region-label";
  regiao.textContent = item.regiao;

  const gps = document.createElement("span");
  gps.className = "gps-label";
  gps.textContent = item.coordenadas
    ? "● GPS cadastrado"
    : "○ Sem GPS";

  topo.append(regiao, gps);

  const titulo = document.createElement("h2");
  titulo.textContent = item.titulo;

  const descricao = document.createElement("div");
  descricao.className = "card-description";
  descricao.textContent =
    item.bairro !== item.regiao
      ? item.bairro
      : "Planaltina · DF";

  const acoes = document.createElement("div");
  acoes.className = "actions";

  const enderecoCompleto =
    `${item.regiao} · ${item.titulo} · Planaltina DF`;

  /* Google Maps */

  const maps = document.createElement("a");
  maps.className = "action-link";
  maps.target = "_blank";
  maps.rel = "noopener noreferrer";

  if (item.coordenadas) {
    maps.href =
      "https://www.google.com/maps/dir/?api=1&destination=" +
      encodeURIComponent(item.coordenadas);

    maps.innerHTML =
      '⌖ <span class="action-text">Google Maps</span>';
  } else {
    maps.href =
      "https://www.google.com/maps/search/?api=1&query=" +
      encodeURIComponent(enderecoCompleto);

    maps.innerHTML =
      '⌕ <span class="action-text">Buscar no Maps</span>';
  }

  acoes.appendChild(maps);

  /* Waze somente com GPS */

  if (item.coordenadas) {
    const waze = document.createElement("a");
    waze.className = "action-link waze";
    waze.target = "_blank";
    waze.rel = "noopener noreferrer";

    waze.href =
      "https://waze.com/ul?ll=" +
      encodeURIComponent(item.coordenadas) +
      "&navigate=yes";

    waze.innerHTML =
      '↗ <span class="action-text">Waze</span>';

    acoes.appendChild(waze);
  }

  /* Copiar endereço */

  const copiar = document.createElement("button");
  copiar.className = "copy-button";
  copiar.textContent = "⧉";
  copiar.title = "Copiar endereço";
  copiar.setAttribute("aria-label", "Copiar endereço");

  copiar.onclick = () => {
    const texto = enderecoCompleto +
      (item.coordenadas
        ? " | GPS: " + item.coordenadas
        : "");

    copiarTexto(texto);
  };

  acoes.appendChild(copiar);

  card.append(topo, titulo, descricao, acoes);

  return card;
}

/* ==========================================
   EXIBIÇÃO DOS RESULTADOS
========================================== */

function mostrarResultados() {
  const resultados = obterResultados();
  const container = el("results");

  container.className =
    "results" + (modoLista ? " list" : "");

  container.replaceChildren();

  el("resultCount").textContent =
    resultados.length.toLocaleString("pt-BR") +
    " endereços encontrados";

  if (resultados.length === 0) {
    const vazio = document.createElement("div");
    vazio.className = "empty";

    vazio.textContent =
      "Nenhum endereço encontrado. " +
      "Tente outra pesquisa ou região.";

    container.appendChild(vazio);
  }

  resultados.slice(0, limite).forEach(item => {
    container.appendChild(criarCard(item));
  });

  el("moreButton").hidden =
    resultados.length <= limite;
}

/* ==========================================
   COPIAR ENDEREÇO
========================================== */

let avisoTimer;

function mostrarAviso(mensagem) {
  const aviso = el("toast");

  aviso.textContent = mensagem;
  aviso.hidden = false;

  clearTimeout(avisoTimer);

  avisoTimer = setTimeout(() => {
    aviso.hidden = true;
  }, 2200);
}

async function copiarTexto(texto) {
  try {
    await navigator.clipboard.writeText(texto);
    mostrarAviso("Endereço copiado!");
  } catch (erro) {
    mostrarAviso("Não foi possível copiar.");
  }
}

/* ==========================================
   EVENTOS
========================================== */

el("searchInput").addEventListener("input", evento => {
  pesquisaAtual = evento.target.value;
  limite = 40;
  mostrarResultados();
});

el("quadraSelect").addEventListener("change", evento => {
  quadraAtual = evento.target.value;
  limite = 40;
  mostrarResultados();
});

el("resetButton").onclick = () => {
  regiaoAtual = "";
  quadraAtual = "";
  pesquisaAtual = "";
  limite = 40;

  el("searchInput").value = "";

  atualizarFiltros();
  mostrarResultados();
};

el("moreButton").onclick = () => {
  limite += 40;
  mostrarResultados();
};

el("viewButton").onclick = () => {
  modoLista = !modoLista;

  el("viewButton").textContent =
    modoLista ? "▦ Cards" : "☷ Lista";

  mostrarResultados();
};

/* ==========================================
   MODO CLARO / ESCURO
========================================== */

function aplicarTema(escuro) {
  document.documentElement.classList.toggle(
    "dark", escuro
  );

  el("themeButton").textContent =
    escuro ? "☀" : "☾";
}

let temaSalvo = null;

try {
  temaSalvo = localStorage.getItem(
    "planaltina-tema"
  );
} catch (erro) {}

aplicarTema(
  temaSalvo
    ? temaSalvo === "escuro"
    : window.matchMedia(
        "(prefers-color-scheme:dark)"
      ).matches
);

el("themeButton").onclick = () => {
  const escuro =
    !document.documentElement.classList.contains("dark");

  aplicarTema(escuro);

  try {
    localStorage.setItem(
      "planaltina-tema",
      escuro ? "escuro" : "claro"
    );
  } catch (erro) {}
};

/* ==========================================
   CARREGAMENTO DO GOOGLE SHEETS
========================================== */

function carregarEnderecos() {
  const callback = "receberEnderecosPlanaltina";
  const script = document.createElement("script");

  let concluido = false;

  const timeout = setTimeout(() => {
    finalizar(false);
  }, 18000);

  function finalizar(sucesso) {
    if (concluido) return;

    concluido = true;
    clearTimeout(timeout);
    script.remove();

    try {
      delete window[callback];
    } catch (erro) {}

    if (!sucesso) {
      el("sourceStatus").textContent =
        "Não foi possível carregar o Google Sheets.";
    }
  }

  window[callback] = resposta => {
    if (
      !resposta ||
      resposta.ok !== true ||
      !Array.isArray(resposta.registros)
    ) {
      finalizar(false);
      return;
    }

    const dados = resposta.registros
      .map(converterLinha)
      .filter(item =>
        item.regiao && item.titulo
      );

    if (!dados.length) {
      finalizar(false);
      return;
    }

    enderecos = dados;

    atualizarFiltros();
    mostrarResultados();

    el("sourceStatus").textContent =
      "✓ Atualizado pelo Google Sheets";

    finalizar(true);
  };

  script.onerror = () => finalizar(false);

  script.src =
    API_URL +
    "?callback=" +
    callback +
    "&t=" +
    Date.now();

  document.head.appendChild(script);
}

/* ==========================================
   INICIALIZAÇÃO
========================================== */

atualizarFiltros();
mostrarResultados();
carregarEnderecos();

</script>

</body>
</html>
